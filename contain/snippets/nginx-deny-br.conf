# ==============================================================================
# protection2shell :: HTTP2Shell containment (CVE-2026-111497)
# nginx — deny Brotli-compressed REQUEST bodies before any decoder sees them.
#
# Install: this file is INCLUDEd inside a `server { }` block by
#   protection2shell --contain      (automatic, validated with `nginx -t`)
# or by hand:
#       server {
#           include /etc/nginx/p2s-deny-br.conf;
#           ...
#       }
#
# Why a request-body guard and not a header strip: the bug is in the decoder,
# so the only reliable control is to never hand attacker bytes to it. Stripping
# `Accept-Encoding: br` from requests is meaningless (that is about responses).
#
# Scope note: this closes the INBOUND direction. Responses your server fetches
# from an attacker-controlled URL are decoded by the app's HTTP client — that is
# a code/config control (decompress: false, or removing the brotli Python
# package), not something a reverse proxy can see.
# ==============================================================================

# Any request advertising a Brotli body is refused. `~*` catches list forms
# such as "gzip, br" and duplicate headers handled by nginx's merged value.
if ($http_content_encoding ~* "br") {
    return 415;
}

# Optional body cap. Weaponised RCE payloads are ~23 MB (2^24 commands x 11
# bits), so a cap below that blocks the known RCE path — but NOT the ~534-byte
# DoS payload. Only enable it if your application's real upload limit is lower:
#     client_max_body_size 16m;
