# ==============================================================================
# protection2shell :: HTTP2Shell containment (CVE-2026-111497)
# Apache httpd — deny Brotli-compressed REQUEST bodies.
#
# Install: `protection2shell --contain` writes this to
#   Debian/Ubuntu : /etc/apache2/conf-available/protection2shell-deny-br.conf
#                   (+ a2enconf / conf-enabled symlink)
#   RHEL/SUSE     : /etc/httpd/conf.d/protection2shell-deny-br.conf
# and validates with `apachectl configtest` (rolled back if that fails).
#
# This is the INBOUND direction only. Responses fetched by the application are
# decoded by the application's HTTP client, not by httpd.
# ==============================================================================

# 1. Tag requests that carry a Brotli body (matches "br" inside list values).
<IfModule mod_setenvif.c>
    SetEnvIfNoCase ^Content-Encoding$ "br" p2s_brotli_request_body=1
</IfModule>

# 2. Refuse them with 415 Unsupported Media Type.
<IfModule mod_rewrite.c>
    RewriteEngine On
    RewriteCond %{ENV:p2s_brotli_request_body} =1
    RewriteRule ^ - [R=415,L]
</IfModule>

# 3. Fallback for servers without mod_rewrite (Apache 2.4 core ap_expr).
<IfModule !mod_rewrite.c>
    <If "%{HTTP:Content-Encoding} =~ /br/i">
        Require all denied
    </If>
</IfModule>
