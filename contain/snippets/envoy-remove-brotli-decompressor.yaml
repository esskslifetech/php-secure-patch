# ==============================================================================
# protection2shell :: HTTP2Shell containment (CVE-2026-111497)
# Envoy / Istio — remove the Brotli *decompressor* (guidance, not auto-applied)
#
# Envoy is only an entry point when a Brotli DECOMPRESSOR is configured. A
# Brotli COMPRESSOR is not affected. Search every listener/HTTP filter chain:
#
#     grep -rn "decompressor" /etc/envoy /etc/istio
#     istioctl proxy-config http <pod>.<ns> -o json | grep -i brotli
#
# If you find a filter like the block below, DELETE the brotli library entry
# (keep the filter and any gzip entry you still need), then reload:
#
# ------------------------------------------------------------------------------
#   http_filters:
#     - name: envoy.filters.http.decompressor
#       typed_config:
#         "@type": type.googleapis.com/envoy.extensions.filters.http.decompressor.v3.Decompressor
#         decompressor_library:                    # <-- DELETE from here
#           name: brotli
#           typed_config:
#             "@type": type.googleapis.com/envoy.extensions.compression.brotli.decompressor.v3.Brotli
#                                                  # <-- to here
# ------------------------------------------------------------------------------
#
# Then patch: Envoy 1.40.0 / 1.39.3 / 1.38.6 / 1.37.8, Istio 1.31.2 / 1.30.6 /
# 1.29.9 (older lines are EOL and get no fix).
#
# DO NOT remove the decompressor if the application behind Envoy decodes Brotli
# itself — Envoy would then pass the compressed body through untouched. In that
# case the guard belongs in the application instead (see contain/guards/).
#
# Also note: no perimeter device can see a response your service FETCHES from an
# attacker-controlled URL. That direction is handled in the client, not here.
