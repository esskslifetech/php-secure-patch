# ==============================================================================
# protection2shell :: apache-php-hardened.conf
# Reference Apache snippet (mod_php / mod_cgi / proxy_fcgi).  Include from the
# main httpd.conf or a vhost:  Include /etc/apache2/conf-available/php-hardened.conf
# ==============================================================================

# ---- PHP2Shell mitigations, applied before request parsing ------------------
# (works for mod_php via php_admin_value; for proxy_fcgi also set the same keys
#  in the FPM pool — see hardening/php-fpm-pool-hardening.conf)
<IfModule mod_php.c>
    php_admin_value session.upload_progress.enabled 0
    php_admin_value allow_url_include 0
    php_admin_flag  expose_php off
    php_admin_value phar.readonly 1
    # CVE-2026-109618: on a VULNERABLE runtime the interim mitigation is
    # memory_limit = -1 plus a cap outside PHP (systemd MemoryMax= / cgroup
    # memory.max) — never RLIMIT_AS/RLIMIT_DATA, and never a tighter limit.
    # Uncomment the -1 line while unpatched; keep the bound once patched.
    # php_admin_value memory_limit -1
    php_admin_value memory_limit 256M
    php_admin_value post_max_size 64M
    php_admin_value upload_max_filesize 32M
    php_admin_value cgi.fix_pathinfo 0
    # PHP 8.5 only:
    # php_admin_value fatal_error_backtraces 0
</IfModule>

# ---- general hardening ------------------------------------------------------
ServerSignature Off
ServerTokens Prod

# never serve dotfiles / VCS / composer internals
<DirectoryMatch "/(\.git|\.svn|vendor|node_modules)">
    Require all denied
</DirectoryMatch>
<FilesMatch "^\.">
    Require all denied
</FilesMatch>

# PHP should only execute from the document roots you intend — never from uploads
# (add per-vhost: <Directory "/var/www/site/public/uploads"> php_admin_flag engine off </Directory>)

# ---- CVE-2024-4577 (Windows php-cgi only) ----------------------------------
# If (and only if) you run php-cgi.exe on Windows and cannot upgrade yet,
# also load hardening/windows-cve-2024-4577.htaccess rules (or the .ps1 kit).
# On every other platform this CVE does not apply.
