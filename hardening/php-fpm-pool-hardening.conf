; ==============================================================================
; php-secure-patch :: php-fpm-pool-hardening.conf
; Reference snippet for a PHP-FPM pool (e.g. /etc/php/X.Y/fpm/pool.d/www.conf).
; setup.sh --fix appends an equivalent, version-aware block automatically.
;
; Why php_admin_* : PHP states the PHP2Shell mitigations must apply BEFORE
; request parsing — php_admin_value/flag cannot be overridden by .user.ini or
; ini_set() inside the request.
; ==============================================================================

; php-secure-patch hardening — begin (safe to remove)

; PHP2Shell: kill the CVE-2026-109619 exploit producer
php_admin_value[session.upload_progress.enabled] = 0

; PHP 8.5 only: disable the fatal_error_backtraces producer
;php_admin_value[fatal_error_backtraces] = 0

; CVE-2026-109618: do NOT pin a PHP-level memory ceiling on a vulnerable
; runtime — that is the predictable trigger the exploit steers.  The advisory's
; interim mitigation is memory_limit=-1 with the cap moved outside PHP:
;   systemd: MemoryMax= on php-fpm.service (size pm.max_children against it)
;   cgroup v2: memory.max       container: --memory / resources.limits.memory
; Never RLIMIT_AS / RLIMIT_DATA (ulimit -v / -d).
; On a patched runtime the inverse holds: keep a finite memory_limit.
;
; if vulnerable (see `setup.sh --oom-mitigation`):
;php_admin_value[memory_limit] = -1
;
; if patched:
;php_admin_value[memory_limit] = 512M

; baseline
php_admin_value[allow_url_include] = 0
php_admin_flag[expose_php] = off
php_admin_value[phar.readonly] = 1
php_admin_value[cgi.fix_pathinfo] = 0

; only execute .php (and nothing else) through this pool
security.limit_extensions = .php

; CVE-2026-109619 and worker recycling:
;   500 = reduced exposure only.  Recycling shortens how long stale worker state
;         survives; it does NOT stop two requests reaching the same worker.
;     1 = removes the cross-request requirement entirely (--lockdown), at a real
;         performance cost.  Neither replaces patching PHP.
pm.max_requests = 500

; kill runaway requests (also bounds the OOM-trigger window)
request_terminate_timeout = 120s

; php-secure-patch hardening — end
