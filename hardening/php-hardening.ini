; ==============================================================================
; protection2shell :: php-hardening.ini
; Reference template.  setup.sh --fix generates a version-aware copy of this as
; 99-p2s-hardening.ini in each PHP install's ini scan directory (it drops
; fatal_error_backtraces on < 8.5 and max_multipart_body_parts on < 8.3).
;
; Two groups:
;   (A) PHP2Shell temporary mitigations — php.net guidance, 21-23 Oct 2026
;   (B) baseline hardening
; ==============================================================================

; ------------------------------------------------------------------------------
; (A) PHP2Shell mitigations
; ------------------------------------------------------------------------------
; CVE-2026-109619: session.upload_progress is a confirmed exploit PRODUCER —
; it fires on any POST before application code runs and needs no session_start().
; php.net: keep this Off even after patching until the next regular bugfix
; release (CVE-2026-115560 informational advisory, 23 Oct 2026).
; Must live in php.ini / FPM pool / server config — NOT .user.ini or ini_set().
session.upload_progress.enabled = Off

; CVE-2026-109618: the exploit steers a CONTROLLED out-of-memory during request
; setup (deeply nested multipart bodies, huge inputs).  That needs a predictable
; per-request ceiling to aim at, so the advisory's interim mitigation for a
; vulnerable runtime is:
;
;     memory_limit = -1        plus        a cap OUTSIDE PHP
;     (systemd MemoryMax= / cgroup v2 memory.max / container limit)
;
; NOT a tighter memory_limit.  Do NOT use RLIMIT_AS / RLIMIT_DATA (ulimit -v/-d):
; they surface as fatal allocation errors — the very bailout being exploited.
; memory_limit=-1 deletes PHP's own guard, so the external cap is mandatory.
; Patched runtime?  Keep the bound instead (it is your availability guard):
;     memory_limit = 256M
;
; This remains containment only; updating PHP is the complete fix.
memory_limit = -1
post_max_size = 64M
upload_max_filesize = 32M
max_multipart_body_parts = 1000   ; PHP >= 8.3 only

; PHP 8.5 ONLY — fatal_error_backtraces backtrace state is a confirmed
; CVE-2026-109619 consumer.  (Ignored/unknown on older branches.)
fatal_error_backtraces = Off

; ------------------------------------------------------------------------------
; (B) Baseline hardening
; ------------------------------------------------------------------------------
allow_url_include = Off
expose_php = Off
cgi.fix_pathinfo = 0
phar.readonly = On
session.use_strict_mode = On
session.use_only_cookies = On
session.cookie_httponly = On
session.cookie_samesite = Lax
mail.add_x_header = Off

; ---- shared-hosting grade (--strict) ----------------------------------------
; display_errors = Off
; zend.assertions = -1
; session.cookie_secure = On
; disable_functions = dl,pcntl_exec            ; review per application!
; open_basedir = /var/www:/tmp                 ; review per application!

; ---- lockdown (--lockdown) --------------------------------------------------
; max_execution_time = 60
; max_input_time = 60
; max_input_vars = 1000
