# ==============================================================================
# php-secure-patch :: nginx-php-hardened.conf
# Reference nginx location block for PHP-FPM / FastCGI, hardened against
# CVE-2019-11043 (env_path_info underflow) and general abuse.
# setup.sh --fix can insert the guard below into existing vhosts automatically.
# ==============================================================================

location ~ [^/]\.php(/|$) {
    fastcgi_split_path_info ^(.+?\.php)(/.*)$;
    # CVE-2019-11043 guard — begin
    # The underflow fires when the captured script name maps to no real file
    # and PATH_INFO ends up empty.  Refuse those requests outright:
    if (!-f $document_root$fastcgi_script_name) { return 404; }
    # CVE-2019-11043 guard — end

    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param PATH_INFO $fastcgi_path_info;
    fastcgi_pass unix:/run/php/php-fpm.sock;   # adjust to your socket/upstream

    # hardening
    fastcgi_hide_header X-Powered-By;
    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;
    fastcgi_read_timeout 120s;
    client_max_body_size 32m;
}

# deny access to dotfiles, composer internals, and VCS metadata
location ~ /\. { deny all; }
location ~* /(composer\.(json|lock|phar)|vendor/|\.git/) { deny all; }

# PHP2Shell note: if some apps do not use multipart forms, you can additionally
# block multipart/form-data at the frontend for those vhosts (php.net suggests
# this as a temporary measure):
#   if ($content_type ~* "multipart/form-data") { return 415; }
