name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The toolkit's own colours are disabled so logs stay readable.
  NO_COLOR: "1"

jobs:
  self-tests:
    name: self-tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      # Which bash actually runs matters: macOS ships 3.2 and that is the
      # compatibility floor, but a Homebrew bash earlier in PATH would hide
      # 3.2-only breakage. Print it so a failure is interpretable.
      - name: Report the shell in use
        shell: bash
        run: |
          printf 'shell     : %s\n' "$BASH_VERSION"
          printf 'resolved  : %s\n' "$(command -v bash)"
          bash --version | head -1

      - name: Syntax check every script
        shell: bash
        run: |
          set -u
          rc=0
          for f in $(find . -type f -name '*.sh' -not -path './.git/*'); do
            if bash -n "$f"; then printf 'ok  %s\n' "$f"; else printf 'BAD %s\n' "$f"; rc=1; fi
          done
          exit "$rc"

      - name: Run the self-test suite
        shell: bash
        run: ./tests/run-tests.sh

      - name: Audit-mode smoke test (dry-run, no changes)
        shell: bash
        run: |
          # A host with nothing to find must still exit 0 (clean) or 2 (findings).
          # Capture the output: when this fails the log is the only explanation,
          # and public repos hide logs from anonymous readers — so surface the
          # tail as an annotation, and re-run under `bash -x` for the trace.
          out="$(mktemp "${TMPDIR:-/tmp}/p2s-smoke.XXXXXX")"
          trace="$(mktemp "${TMPDIR:-/tmp}/p2s-trace.XXXXXX")"
          rc=0
          ./setup.sh --dry-run --no-upgrade >"$out" 2>&1 || rc=$?
          case "$rc" in
            0|2)
              echo "dry-run completed with rc=$rc"
              tail -n 20 "$out"
              ;;
            *)
              echo "unexpected exit code $rc"
              cat "$out"
              bash -x ./setup.sh --dry-run --no-upgrade >/dev/null 2>"$trace" || true
              echo "--- trace tail ---"
              tail -n 15 "$trace"
              echo "::error::setup.sh exited $rc on $(command -v bash) ($BASH_VERSION)"
              tail -n 10 "$trace" | while IFS= read -r line; do
                printf '::error::%s\n' "$line"
              done
              exit 1
              ;;
          esac

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck

      # Two tiers, deliberately different:
      #   error severity  -> blocks. A parse error or a broken expansion is
      #                      always a real defect and must never ship.
      #   warning severity-> reported, does not block. The tree is not
      #                      warning-clean yet (mostly SC2046 on `for x in
      #                      $(find ...)`). Findings stay visible here and in
      #                      the job summary so they can be burned down without
      #                      a red X that nobody reads.
      - name: Lint (errors block, warnings are reported)
        shell: bash
        run: |
          set -u
          targets="setup.sh rollback.sh install.sh lib/common.sh lib/detect.sh
                   lib/brotli_db.sh lib/detect_brotli.sh lib/cve_db.sh lib/fix.sh
                   lib/contain.sh lib/verify.sh lib/report.sh hunt/hunt.sh
                   tests/run-tests.sh patches/apply-source-patches.sh
                   patches/apply-brotli-patch.sh"
          # shellcheck disable=SC2086
          if shellcheck -S error -x $targets; then
            echo "error-severity: clean"
          else
            echo "::error::shellcheck reported error-severity findings"
            exit 1
          fi
          # shellcheck disable=SC2086
          shellcheck -S warning -x -f gcc $targets > sc.txt 2>&1 || true
          n="$(grep -cE '(warning|error):' sc.txt || true)"
          echo "warning-severity findings: $n"
          cat sc.txt
          {
            echo "### shellcheck — warning severity"
            echo
            echo "Findings: **$n** (advisory; error severity is enforced above)"
            echo
            echo '```'
            cat sc.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          head -10 sc.txt | while IFS= read -r line; do
            printf '::warning::%s\n' "$line"
          done

  guards:
    name: containment guards (node/python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # A preload that throws on load is worse than no preload: it takes the
      # service down on restart. Syntax-check both guards and exercise the Node
      # one against a real HTTP server (the same test the suite runs).
      - name: Syntax-check the Node preload
        run: node --check contain/guards/node-p2s-guard.cjs

      - name: Compile-check the Python hook
        run: python3 -m py_compile contain/guards/python-p2s-guard.py

      - name: Node preload refuses a Brotli request body
        run: |
          set -euo pipefail
          cat > /tmp/app.js <<'EOF'
          const http = require('http');
          http.createServer((req, res) => { req.resume(); req.on('end', () => { res.writeHead(200); res.end('ok'); }); })
              .listen(18080);
          EOF
          node -r "$PWD/contain/guards/node-p2s-guard.cjs" /tmp/app.js &
          pid=$!
          sleep 1
          code="$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Encoding: br' --data-binary x http://127.0.0.1:18080/)"
          plain="$(curl -s -o /dev/null -w '%{http_code}' -X POST --data-binary x http://127.0.0.1:18080/)"
          kill "$pid" || true
          echo "br=$code plain=$plain"
          [ "$code" = "415" ]
          [ "$plain" = "200" ]

  brotli-patch:
    name: Brotli patch applies to upstream (CVE-2026-111497)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The patches are the claim this project makes about being able to fix
      # vendored copies permanently, so CI re-proves it against pristine
      # upstream tags rather than trusting the committed diff.
      - name: Fetch pristine Brotli releases
        run: |
          set -euo pipefail
          for tag in v1.2.0 v1.1.0 v1.0.9; do
            curl -fsSL -o "/tmp/$tag.tar.gz" "https://codeload.github.com/google/brotli/tar.gz/refs/tags/$tag"
            tar xzf "/tmp/$tag.tar.gz" -C /tmp
          done

      - name: Apply + verify (compile check) on 1.2.0, 1.1.0 and 1.0.9
        run: |
          ./patches/apply-brotli-patch.sh /tmp/brotli-1.2.0 --verify
          ./patches/apply-brotli-patch.sh /tmp/brotli-1.1.0 --verify
          ./patches/apply-brotli-patch.sh /tmp/brotli-1.0.9 --verify

      - name: Re-apply must be detected, not double-patched
        run: |
          set -euo pipefail
          if ./patches/apply-brotli-patch.sh /tmp/brotli-1.2.0 2>&1 | grep -q "already contains the fix"; then
            echo "re-apply correctly skipped"
          else
            echo "::error::re-applying the patch was not detected"
            exit 1
          fi

      - name: Revert restores the original, and the patch re-applies
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/clean.tar.gz https://codeload.github.com/google/brotli/tar.gz/refs/tags/v1.0.9
          rm -rf /tmp/clean-1.0.9 && mkdir -p /tmp/clean-1.0.9
          tar xzf /tmp/clean.tar.gz -C /tmp/clean-1.0.9 --strip-components=1
          ./patches/apply-brotli-patch.sh /tmp/clean-1.0.9 >/dev/null
          grep -q "BROTLI_SAFE_WITH_STATUS" /tmp/clean-1.0.9/c/dec/decode.c
          ./patches/apply-brotli-patch.sh /tmp/clean-1.0.9 --revert >/dev/null
          if grep -q "BROTLI_SAFE_WITH_STATUS" /tmp/clean-1.0.9/c/dec/decode.c; then
            echo "::error::revert left the fix behind"
            exit 1
          fi
          ./patches/apply-brotli-patch.sh /tmp/clean-1.0.9 --dry-run | grep -q "applies cleanly"
          echo "apply -> revert -> apply is clean"

  php-lint:
    name: php lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install php-cli
        run: sudo apt-get update -qq && sudo apt-get install -y php-cli

      - name: Lint the project scanner
        run: php -l scanner/project-scanner.php

  windows-smoke:
    name: windows (git-bash) smoke — advisory
    runs-on: windows-latest
    # Advisory until the suite is green there on a real host: the toolkit must
    # parse and run its audit under Git-Bash, but Windows-specific paths and
    # missing coreutils can differ from Linux/macOS CI runners. Reported, not
    # gating, so a red X never blocks a security fix.
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Report the shell
        run: |
          echo "$BASH_VERSION"
          uname -a

      - name: Syntax-check every script
        run: |
          rc=0
          for f in $(find . -type f -name '*.sh' -not -path './.git/*'); do
            bash -n "$f" || rc=1
          done
          exit "$rc"

      - name: Help + audit must not crash
        run: |
          ./setup.sh --help >/dev/null
          ./setup.sh --dry-run --no-upgrade --scan-path . >/dev/null 2>&1; rc=$?
          echo "audit rc=$rc"
          [ "$rc" = 0 ] || [ "$rc" = 2 ]
